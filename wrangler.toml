name = "centralhub-backend"
main = "worker.mjs"
compatibility_date = "2026-10-16"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[observability]
enabled = true

[triggers]
crons = ["15 * * * *"]

[[durable_objects.bindings]]
name = "WEBSOCKET_HUB"
class_name = "WebSocketHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebSocketHub"]
